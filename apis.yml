aid: altana-ai
name: Altana AI
description: >-
  Altana is an AI-powered network for trusted trade, operating the world's largest
  knowledge graph of the global supply chain — a map covering roughly half of global
  trade and 600M+ companies, built from shipment and product information contributed
  by logistics providers and businesses. Altana connects enterprises, logistics
  providers, suppliers, and government agencies (including US Customs and Border
  Protection) around a shared source of product truth, delivered as Product Passports
  and the Atlas knowledge graph. Its solutions span trade and tariffs, sourcing and
  procurement, supplier management and screening, supply chain risk, regulatory
  compliance (UFLPA, EUDR, Section 889), and trade compliance. The Atlas Graph API
  (customer-provisioned, HMAC-signed API keys) exposes advanced searches across the
  Atlas knowledge graph, including notebook-based analysis in Databricks.
